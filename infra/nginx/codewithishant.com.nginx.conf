# /etc/nginx/sites-available/codewithishant.com
#
# SETUP STEPS (run on VPS after copying this file):
#
#   1. Install nginx + certbot:
#        sudo apt install nginx certbot python3-certbot-nginx -y
#
#   2. Copy this file:
#        sudo cp codewithishant.com /etc/nginx/sites-available/codewithishant.com
#        sudo ln -s /etc/nginx/sites-available/codewithishant.com /etc/nginx/sites-enabled/
#
#   3. Get TLS cert (certbot will auto-fill ssl_certificate paths):
#        sudo certbot --nginx -d codewithishant.com -d www.codewithishant.com
#
#   4. Test + reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
#   5. Auto-renew (certbot installs cron automatically, verify):
#        sudo certbot renew --dry-run

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name codewithishant.com www.codewithishant.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://codewithishant.com$request_uri;
    }
}

# ── www → non-www redirect ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.codewithishant.com;

    ssl_certificate     /etc/letsencrypt/live/codewithishant.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codewithishant.com/privkey.pem;

    return 301 https://codewithishant.com$request_uri;
}

# ── main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codewithishant.com;

    # ── TLS certs (certbot fills these) ───────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/codewithishant.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codewithishant.com/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # ── request size limit (matches backend 2MB) ──────────────────────────────
    client_max_body_size 2M;

    # ── frontend — Next.js on port 3000 ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── backend — FastAPI on port 8000 ───────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── static Next.js assets — cache aggressively ────────────────────────────
    location /_next/static/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires          1y;
        add_header       Cache-Control "public, immutable";
        access_log       off;
    }

    # ── logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/codewithishant.access.log;
    error_log  /var/log/nginx/codewithishant.error.log warn;
}